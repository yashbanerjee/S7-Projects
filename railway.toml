# Used when Railway Root Directory is the monorepo root (empty).
# Prefer setting Root Directory to `frontend` on the frontend service.
# For backend: set Root Directory to `backend` (uses backend/railway.toml).

[build]
builder = "NIXPACKS"
buildCommand = "npm install --prefix frontend --include=dev && npm run build --prefix frontend"

[deploy]
startCommand = "npm run start --prefix frontend"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
