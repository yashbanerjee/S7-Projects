# Prefer: set Railway Root Directory to `frontend` on this service.
# If Root Directory is empty (repo root), monorepo root railway.toml/nixpacks handles frontend.

[build]
builder = "NIXPACKS"
buildCommand = "npm install --include=dev && npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
